{% extends "base.html" %}
{% block title %}乘客注册 - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-wrap" style="max-width: 520px;">
    <div class="auth-card">
        <h1 class="auth-title">乘客注册</h1>
        <p class="auth-sub">注册后即可发起叫车。司机账号需由平台管理员创建。</p>

        {% if error %}
            <div class="flash flash-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/register">
            <div class="form-row">
                <label for="username">用户名 <span class="muted">（3~20 位字母、数字或下划线）</span></label>
                <input type="text" id="username" name="username"
                       value="{{ username or '' }}" required autofocus
                       pattern="[A-Za-z0-9_]{3,20}">
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label for="password">密码 <span class="muted">（至少 6 位）</span></label>
                    <input type="password" id="password" name="password"
                           minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-row">
                    <label for="confirm">确认密码</label>
                    <input type="password" id="confirm" name="confirm"
                           minlength="6" required autocomplete="new-password">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label for="real_name">姓名</label>
                    <input type="text" id="real_name" name="real_name"
                           value="{{ real_name or '' }}" required>
                </div>
                <div class="form-row">
                    <label for="phone">手机号</label>
                    <input type="tel" id="phone" name="phone"
                           value="{{ phone or '' }}" pattern="1[3-9][0-9]{9}"
                           placeholder="11 位手机号" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label>性别</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="0"
                            {% if gender is not defined or gender == 0 %}checked{% endif %}> 保密</label>
                        <label><input type="radio" name="gender" value="1"
                            {% if gender == 1 %}checked{% endif %}> 男</label>
                        <label><input type="radio" name="gender" value="2"
                            {% if gender == 2 %}checked{% endif %}> 女</label>
                    </div>
                </div>
                <div class="form-row">
                    <label for="home_region">常驻区域 <span class="muted">（选填）</span></label>
                    <select id="home_region" name="home_region">
                        <option value="">请选择</option>
                        {% for r in ['朝阳区','海淀区','东城区','西城区','丰台区','通州区','昌平区','大兴区'] %}
                            <option value="{{ r }}" {% if home_region == r %}selected{% endif %}>{{ r }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-actions" style="border:0; padding:0; margin-top: 20px;">
                <button class="btn btn-lg" type="submit" style="width:100%;">注 册</button>
            </div>
        </form>

        <div class="auth-foot">
            已有账号？<a href="/auth/login">返回登录</a>
        </div>
    </div>
</div>
{% endblock %}
