{% extends "base.html" %}
{% block title %}修改密码 - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">修改密码</h1>
        <p class="auth-sub">修改成功后当前会话会失效，需要重新登录。</p>

        {% if error %}
            <div class="flash flash-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/password">
            <div class="form-row">
                <label for="old_password">原密码</label>
                <input type="password" id="old_password" name="old_password"
                       required autocomplete="current-password">
            </div>
            <div class="form-row">
                <label for="new_password">新密码 <span class="muted">（至少 6 位）</span></label>
                <input type="password" id="new_password" name="new_password"
                       minlength="6" required autocomplete="new-password">
            </div>
            <div class="form-row">
                <label for="confirm">确认新密码</label>
                <input type="password" id="confirm" name="confirm"
                       minlength="6" required autocomplete="new-password">
            </div>

            <div class="form-actions">
                <button class="btn" type="submit">确认修改</button>
                <a class="btn btn-ghost" href="javascript:history.back()">返回</a>
            </div>
        </form>

        <div class="demo-accounts">
            密码以 <b>PBKDF2-HMAC-SHA256</b> 加盐哈希后存入
            <code>account.password_hash</code>，每位用户使用独立随机盐，
            迭代次数随行存于 <code>pwd_iterations</code> 列。
        </div>
    </div>
</div>
{% endblock %}
