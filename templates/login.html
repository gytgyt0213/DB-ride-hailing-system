{% extends "base.html" %}
{% block title %}登录 - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">🚕 {{ app_name }}</h1>
        <p class="auth-sub">乘客下单 · 平台派单 · 司机接单 · 行程追踪 · 自动计价</p>

        {% if error %}
            <div class="flash flash-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/login">
            <input type="hidden" name="next" value="{{ next_url or '' }}">

            <div class="form-row">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username"
                       value="{{ username or '' }}" autocomplete="username"
                       placeholder="如 p001 / d001 / admin" required autofocus>
            </div>

            <div class="form-row">
                <label for="password">密码</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" placeholder="请输入密码" required>
            </div>

            <div class="form-actions" style="border:0; padding:0; margin-top: 20px;">
                <button class="btn btn-lg" type="submit" style="width:100%;">登 录</button>
            </div>
        </form>

        <div class="auth-foot">
            还没有账号？<a href="/auth/register">乘客自助注册</a>
        </div>

        <div class="demo-accounts">
            <b>演示账号</b><br>
            管理员 <code>admin</code> / <code>admin123</code><br>
            司机 <code>d001</code> ~ <code>d030</code> / <code>123456</code><br>
            乘客 <code>p001</code> ~ <code>p050</code> / <code>123456</code>
        </div>
    </div>
</div>
{% endblock %}
